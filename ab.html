<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AB Switches - KSEB Kanchiyar</title>
  <link href="main.css" rel="stylesheet">
  <style>
    .ab-list { max-width:900px; margin:2rem auto; padding:1rem; }
    .ab-item { padding:8px 12px; border-bottom:1px solid #eee; }
    .ab-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }

    body.ab-page .kva-badge { border:1px solid transparent; transition:background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
    body.ab-page .kva-badge.status-linked { background:#dcfce7; color:#047857; border-color:#bbf7d0; }
    body.ab-page .kva-badge.status-partial { background:#fef3c7; color:#92400e; border-color:#fde68a; }
    body.ab-page .kva-badge.status-none { background:#fee2e2; color:#b91c1c; border-color:#fecaca; }
    body.ab-page .btn-reset { background:#fee2e2; color:#b91c1c; }
    body.ab-page .btn-reset:hover { background:#fecaca; }
  </style>
</head>
<body class="ab-page">
  <header>
    <h1>KSEB Kanchiyar Section</h1>
    <p>AB Switches - Interactive List</p>
    <div class="badge-header">Updated: 08.05.2024</div>
  </header>
  
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <h3>Secure Access</h3>
      <p>Please sign in to view AB switches.</p>
      <form id="authForm">
        <div class="form-group">
          <label for="authUser">Username</label>
          <input type="text" id="authUser" class="form-select" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="authPass">Password</label>
          <input type="password" id="authPass" class="form-select" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="btn btn-save">Unlock</button>
      </form>
    </div>
  </div>

  <div class="controls">
    <div class="control-bar">
      <div class="search-box">
        <span class="search-icon">&#128269;</span>
        <input type="text" id="abSearch" placeholder="Search AB switch...">
        <button type="button" class="search-clear-btn" id="abSearchClearBtn" aria-label="Clear search">&times;</button>
      </div>
      <div class="filters">
        <button class="filter-btn active" onclick="filterAB('all', this)">All</button>
      </div>
      <div>
        <button class="btn btn-cancel" onclick="window.location.href='index.html'">Back</button>
      </div>
    </div>
  </div>

  <main>
    <section class="feeder-section">
      <div class="feeder-header">
        <h2>AB Switches</h2>
        <span class="voltage-badge">AB List</span>
      </div>
      <div class="transformer-grid" id="ab-grid">
        <!-- AB cards will be injected here -->
      </div>
    </section>
  </main>

  <footer style="text-align:center;">
    <small style="color:#6b7280;">Generated from AB.txt</small>
  </footer>

  <script src="main.js"></script>
  <script>
    let feedersList = [];
    let abLinks = [];
    let abLocations = [];

    async function loadAB() {
      try {
        const [resLoc, resFeeders, resLinks] = await Promise.all([
          fetch('/api/locations'),
          fetch('/api/feeders'),
          fetch('/api/ablinks')
        ]);
        if (!resLoc.ok) throw new Error('Failed to load locations');

        abLocations = await resLoc.json();
        feedersList = resFeeders.ok ? await resFeeders.json() : ['feeder-kanchiyar','feeder-nariampara','feeder-vellilamkandam','feeder-vandanmeedu','feeder-nedumkandam'];
        abLinks = resLinks.ok ? await resLinks.json() : [];

        renderABGrid();

        const search = document.getElementById('abSearch');
        if (search) {
          search.oninput = applyABSearchFilter;
          applyABSearchFilter();
        }

      } catch (e) {
        console.error(e);
        const grid = document.getElementById('ab-grid');
        if (grid) grid.textContent = 'Could not load AB list.';
      }
    }

    function renderABGrid() {
      const grid = document.getElementById('ab-grid');
      if (!grid) return;

      if (!abLocations.length) {
        grid.innerHTML = '<div class="empty-state">No AB locations found.</div>';
        return;
      }

      const ordered = [...abLocations].sort((a, b) => {
        const aLinked = hasCompleteLink(a.id);
        const bLinked = hasCompleteLink(b.id);
        if (aLinked === bLinked) return a.name.localeCompare(b.name);
        return aLinked ? -1 : 1;
      });

      grid.innerHTML = '';
      ordered.forEach(row => {
        const card = document.createElement('div');
        card.className = 'transformer-card kv-100';
        card.style.cursor = 'pointer';

        const moveContainer = document.createElement('div');
        moveContainer.className = 'move-btn-container';
        moveContainer.innerHTML = `<button class="move-btn">&#8635;</button><span class="move-tooltip">Link AB</span>`;

        const nameEl = document.createElement('div');
        nameEl.className = 'tr-name';
        nameEl.textContent = row.name;

        const idEl = document.createElement('div');
        idEl.className = 'tr-id';
        idEl.textContent = `AB-${row.id}`;

        const badge = document.createElement('div');
        badge.className = 'kva-badge';
        const badgeDetails = buildBadgeDetails(row.id);
        badge.textContent = badgeDetails.text;
        badge.classList.add(badgeDetails.statusClass);

        card.appendChild(moveContainer);
        card.appendChild(nameEl);
        card.appendChild(idEl);
        card.appendChild(badge);

        card.addEventListener('click', () => openABLinkModal(row));

        grid.appendChild(card);
      });

      applyABSearchFilter();
    }

    function applyABSearchFilter() {
      const grid = document.getElementById('ab-grid');
      const search = document.getElementById('abSearch');
      if (!grid || !search) return;
      const query = search.value.trim().toLowerCase();
      grid.querySelectorAll('.transformer-card').forEach(card => {
        const name = card.querySelector('.tr-name')?.textContent?.toLowerCase() || '';
        card.style.display = !query || name.indexOf(query) > -1 ? '' : 'none';
      });
    }

    function getLinkRecord(locationId) {
      return abLinks.find(a => a.location_id === locationId);
    }

    function hasCompleteLink(locationId) {
      const record = getLinkRecord(locationId);
      return Boolean(record && record.feeder_a && record.feeder_b);
    }

    function formatFeederLabel(slug = '') {
      if (!slug) return '';
      const cleaned = slug.replace(/^feeder-/, '').replace(/-/g, ' ');
      return cleaned.replace(/\b\w/g, char => char.toUpperCase());
    }

    function buildBadgeDetails(locationId) {
      const record = getLinkRecord(locationId);
      if (record && record.feeder_a && record.feeder_b) {
        const aName = formatFeederLabel(record.feeder_a);
        const bName = formatFeederLabel(record.feeder_b);
        return { text: `${aName} ↔ ${bName}`, statusClass: 'status-linked' };
      }
      if (record && (record.feeder_a || record.feeder_b)) {
        const name = formatFeederLabel(record.feeder_a || record.feeder_b);
        return { text: `${name} waiting`, statusClass: 'status-partial' };
      }
      return { text: 'No link', statusClass: 'status-none' };
    }

    function openABLinkModal(location) {
      // build modal if not exists
      let modal = document.getElementById('abLinkModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'abLinkModal';
        modal.innerHTML = `
          <div class="modal-box">
            <h3 class="modal-title">Create Interlink for AB</h3>
            <div class="form-group">
              <label>AB Location</label>
              <div id="abName" style="font-weight:600"></div>
            </div>
            <div class="form-group">
              <label for="feederA">Feeder A</label>
              <select id="feederA" class="form-select"></select>
            </div>
            <div class="form-group">
              <label for="feederB">Feeder B</label>
              <select id="feederB" class="form-select"></select>
            </div>
            <div class="modal-actions" style="justify-content:space-between;align-items:center;">
              <button class="btn btn-reset" id="abReset" type="button">Reset interlink</button>
              <div style="display:flex;gap:0.75rem;">
                <button class="btn btn-cancel" id="abCancel">Cancel</button>
                <button class="btn btn-save" id="abSave">Submit</button>
              </div>
            </div>
          </div>`;
        document.body.appendChild(modal);
        document.getElementById('abCancel').addEventListener('click', () => modal.classList.remove('active'));
      }

      // populate feeders
      const selA = modal.querySelector('#feederA');
      const selB = modal.querySelector('#feederB');
      selA.innerHTML = '';
      selB.innerHTML = '';

      const createPlaceholder = () => {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Select feeder';
        option.disabled = true;
        option.selected = true;
        return option;
      };

      selA.appendChild(createPlaceholder());
      selB.appendChild(createPlaceholder());
      feedersList.forEach(f => {
        const o1 = document.createElement('option'); o1.value = f; o1.textContent = f.replace('feeder-','');
        const o2 = document.createElement('option'); o2.value = f; o2.textContent = f.replace('feeder-','');
        selA.appendChild(o1);
        selB.appendChild(o2);
      });

      document.getElementById('abName').textContent = location.name;

      // preselect if exists
      const existing = abLinks.find(a => a.location_id === location.id);
      if (existing) {
        if (existing.feeder_a && selA.querySelector(`option[value="${existing.feeder_a}"]`)) {
          selA.value = existing.feeder_a;
        } else {
          selA.selectedIndex = 0;
        }
        if (existing.feeder_b && selB.querySelector(`option[value="${existing.feeder_b}"]`)) {
          selB.value = existing.feeder_b;
        } else {
          selB.selectedIndex = 0;
        }
      } else {
        selA.selectedIndex = 0;
        selB.selectedIndex = 0;
      }

      const resetBtn = document.getElementById('abReset');
      if (resetBtn) {
        resetBtn.onclick = () => resetABLink(location, modal);
      }

      modal.classList.add('active');

      document.getElementById('abSave').onclick = async () => {
        const payload = { locationId: location.id, feederA: selA.value, feederB: selB.value };
        try {
          const resp = await fetch('/api/ablink', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
          if (!resp.ok) throw new Error('save failed');
          // update local cache
          const idx = abLinks.findIndex(a => a.location_id === location.id);
          if (idx >= 0) abLinks[idx] = { ...abLinks[idx], feeder_a: payload.feederA, feeder_b: payload.feederB };
          else abLinks.push({ location_id: location.id, feeder_a: payload.feederA, feeder_b: payload.feederB });
          renderABGrid();
          showToast('Interlink saved');
          if (typeof logActivity === 'function') {
            const aLabel = formatFeederLabel(payload.feederA);
            const bLabel = formatFeederLabel(payload.feederB);
            const linkLabel = bLabel ? `${aLabel || 'Feeder A'} ↔ ${bLabel}` : (aLabel || bLabel || 'Feeder pending');
            logActivity({
              action: 'update_ab_link',
              title: 'AB link saved',
              description: `${location.name}: ${linkLabel}`
            });
          }
          modal.classList.remove('active');
        } catch (e) {
          console.error(e);
          showToast('Could not save interlink');
        }
      };
    }

    async function resetABLink(location, modal) {
      if (!location) return;
      try {
        const resp = await fetch(`/api/ablink/${location.id}`, { method: 'DELETE' });
        if (!resp.ok) throw new Error('reset failed');
        abLinks = abLinks.filter(link => link.location_id !== location.id);
        renderABGrid();
        showToast('Interlink reset');
        if (typeof logActivity === 'function') {
          logActivity({
            action: 'reset_ab_link',
            title: 'AB link reset',
            description: `${location.name} interlink cleared`
          });
        }
        if (modal) {
          const selA = modal.querySelector('#feederA');
          const selB = modal.querySelector('#feederB');
          if (selA) selA.selectedIndex = 0;
          if (selB) selB.selectedIndex = 0;
          modal.classList.remove('active');
        }
      } catch (e) {
        console.error(e);
        showToast('Could not reset interlink');
      }
    }

    function filterAB(k, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (k === 'all') {
        document.querySelectorAll('#ab-grid .transformer-card').forEach(c => c.style.display = '');
      }
    }

    function setupAbSearchClear() {
      const input = document.getElementById('abSearch');
      const button = document.getElementById('abSearchClearBtn');
      if (!input || !button) return;
      button.addEventListener('click', () => {
        input.value = '';
        applyABSearchFilter();
        input.focus();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupAbSearchClear();
      const refreshAbData = () => {
        if (typeof requireAuth === 'function') {
          requireAuth(loadAB);
        } else {
          loadAB();
        }
      };
      refreshAbData();
      if (typeof registerAutoRefresh === 'function') {
        registerAutoRefresh(refreshAbData);
      }
    });
  </script>
</body>
</html>
