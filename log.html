<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Log - KSEB Kanchiyar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <style>
        body.log-page { background: #f8fafc; }
        .log-container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
        .log-card { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); padding: 2rem; }
        .log-entry { border-left: 4px solid var(--primary); padding-left: 1rem; margin-bottom: 1.5rem; }
        .log-meta { font-size: 0.85rem; color: var(--text-muted); display:flex; gap:1rem; flex-wrap:wrap; }
        .log-title { font-size: 1.1rem; font-weight: 600; margin: 0.2rem 0; color: var(--primary-dark); }
        .log-description { margin: 0.5rem 0 0; color: #374151; line-height: 1.5; }
        .log-empty { text-align:center; padding:2rem 0; color:var(--text-muted); }
    </style>
</head>
<body class="log-page">
    <header>
        <h1>KSEB Kanchiyar Section</h1>
        <p>Activity log &mdash; track who changed what</p>
        <div class="badge-header">Internal use only</div>
    </header>

    <div class="log-container">
        <div class="log-card">
            <div id="logEntries" class="log-list"></div>
        </div>
    </div>

    <footer>
        <p style="text-align:center; color:#6b7280; font-size:0.85rem;">Logs are stored on the server so every operator sees the same history.</p>
    </footer>

    <script src="main.js"></script>
    <script>
        const LOG_PAGE_LIMIT = 200;

        document.addEventListener('DOMContentLoaded', () => {
            loadAndRenderLogs();
            if (typeof registerAutoRefresh === 'function') {
                registerAutoRefresh(loadAndRenderLogs);
            }
        });

        async function loadAndRenderLogs() {
            const list = document.getElementById('logEntries');
            if (!list) return;
            list.innerHTML = '<div class="log-empty">Loading latest activity…</div>';
            try {
                const response = await fetch(`/api/logs?limit=${LOG_PAGE_LIMIT}`);
                if (!response.ok) throw new Error('Failed to fetch logs');
                const entries = await response.json();
                renderLogs(entries);
            } catch (err) {
                console.error('Unable to load logs', err);
                list.innerHTML = '<div class="log-empty">Unable to load logs from server.</div>';
            }
        }

        function renderLogs(entries = []) {
            const list = document.getElementById('logEntries');
            if (!list) return;
            if (!entries.length) {
                list.innerHTML = '<div class="log-empty">No activity recorded yet.</div>';
                return;
            }
            list.innerHTML = '';
            entries.forEach(entry => {
                const wrapper = document.createElement('div');
                wrapper.className = 'log-entry';
                const title = document.createElement('div');
                title.className = 'log-title';
                title.textContent = entry.title || entry.action || 'Update';
                const meta = document.createElement('div');
                meta.className = 'log-meta';
                const user = document.createElement('span');
                user.textContent = `By: ${entry.user || 'Unknown'}`;
                const time = document.createElement('span');
                const ts = entry.timestamp ? new Date(entry.timestamp).toLocaleString() : 'Unknown date';
                time.textContent = ts;
                meta.appendChild(user);
                meta.appendChild(time);
                const desc = document.createElement('p');
                desc.className = 'log-description';
                desc.textContent = entry.description || 'No description provided.';
                wrapper.appendChild(title);
                wrapper.appendChild(meta);
                wrapper.appendChild(desc);
                list.appendChild(wrapper);
            });
        }
    </script>
</body>
</html>
